name: Radar SCZ tests

# Manual-only on purpose. This account previously received a GitHub restriction
# related to automatic workflows interacting with third-party services.
# This workflow only installs this repository's test dependencies and runs pytest.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run local unit tests
        run: pytest -q
